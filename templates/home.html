<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehicle Detection</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #222; }
        .container { max-width: 700px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
        h1 { margin-top: 0; }
        form { display: grid; gap: 12px; }
        input[type="file"] { padding: 8px; }
        button { padding: 10px 16px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
        .error { color: #b91c1c; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vehicle Detection App</h1>
        <p>Upload an image to run detection. The app will use the default model from the models folder unless you choose a different .pt file.</p>
        <p><strong>Default model:</strong> {{ model_name }}</p>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post" enctype="multipart/form-data" action="{% url 'upload_image' %}">
            {% csrf_token %}
            <label>Model file (.pt) - optional</label>
            <input type="file" name="model_file" accept=".pt" />
            <label>Image file</label>
            <input type="file" name="image_file" accept="image/*" required />
            <button type="submit">Run Detection</button>
        </form>
    </div>
</body>
</html>
